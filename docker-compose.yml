version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: manutencao-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 5

  auth-service:
    build: .
    container_name: auth-service
    command: uvicorn services.auth_service.main:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "8001:8001"
    environment:
      - AUTH_DATABASE_URL=sqlite:///./auth.db
    volumes:
      - .:/app

  estrutura-service:
    build: .
    container_name: estrutura-service
    command: uvicorn services.estrutura_service.main:app --host 0.0.0.0 --port 8002 --reload
    ports:
      - "8002:8002"
    environment:
      - ESTRUTURA_DATABASE_URL=sqlite:///./estrutura.db
      - RABBITMQ_HOST=rabbitmq
    volumes:
      - .:/app
    depends_on:
      rabbitmq:
        condition: service_healthy

  manutencao-service:
    build: .
    container_name: manutencao-service
    command: uvicorn services.manutencao_service.main:app --host 0.0.0.0 --port 8003 --reload
    ports:
      - "8003:8003"
    environment:
      - MANUTENCAO_DATABASE_URL=sqlite:///./manutencao.db
      - RABBITMQ_HOST=rabbitmq
    volumes:
      - .:/app
    depends_on:
      rabbitmq:
        condition: service_healthy

  graphql-gateway:
    build: .
    container_name: graphql-gateway
    command: uvicorn gateway.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8001/graphql
      - ESTRUTURA_SERVICE_URL=http://estrutura-service:8002/graphql
      - MANUTENCAO_SERVICE_URL=http://manutencao-service:8003/graphql
    depends_on:
      - auth-service
      - estrutura-service
      - manutencao-service

  dashboard-ui:
    build: .
    container_name: dashboard-ui
    command: streamlit run dashboard.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - GRAPHQL_URL=http://graphql-gateway:8000/graphql
    depends_on:
      - graphql-gateway
